[workspace]
resolver = "3"
members = ["crates/gedeeld", "crates/server", "crates/renderer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
gedeeld = { path = "crates/gedeeld" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
ts-rs = "12"
tungstenite = "0.30"
tokio-tungstenite = "0.30"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "fs", "signal", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs"] }
jiff = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
bevy = { version = "0.20.1", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
